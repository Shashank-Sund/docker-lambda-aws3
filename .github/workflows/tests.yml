name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: image/requirements*.txt
      - run: pip install -r image/requirements.txt -r image/requirements-dev.txt
      - run: python -m pytest -q image/tests -m "not live"
